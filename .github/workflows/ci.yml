name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    if: github.event.deleted != true && (github.ref_type != 'tag' || (github.event_name == 'push' && github.event.created == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: rhodium
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: rhodium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhodium -d rhodium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database: integration tests TRUNCATE every table.
      DATABASE_URL: postgresql://rhodium:testpw@127.0.0.1:5432/rhodium_test?schema=public
      TEST_DATABASE_URL: postgresql://rhodium:testpw@127.0.0.1:5432/rhodium_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
      # Audited local main before the empty GitHub repository's first publication.
      # Existing push/PR/queue bases always take precedence over this bootstrap.
      CI_BOOTSTRAP_BASE: 7552cd5d2ef8dcea6db139c518665dee692cbc05
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.4

      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Select affected checks
        if: github.ref_type != 'tag'
        id: scope
        run: node scripts/ci-checks.mjs plan

      - name: Validate new version tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: node -e 'if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.VERSION)) process.exit(1)'

      - name: Restore licensed UI from a successful trusted push
        if: steps.scope.outputs.licensed == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-licensed.mjs restore

      - name: Initialize licensed UI
        if: (steps.scope.outputs.licensed == 'true' || github.ref_type == 'tag') && github.event_name == 'push'
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          test -n "$HEROUI_KEY" || { echo '::error::Missing repository HEROUI_KEY secret'; exit 1; }
          CI=1 node node_modules/hpsetup/bin.js react --auto --no-cache
          git diff --exit-code -- package.json package-lock.json
          node -e 'const fs=require("node:fs"),path=require("node:path"); const root=path.resolve("node_modules/@heroui-pro/react"); const p=JSON.parse(fs.readFileSync(path.join(root,"package.json"),"utf8")); if(!p.types||!fs.existsSync(path.join(root,p.types))) throw new Error("Licensed HeroUI types were not installed");'

      - name: Package the installed licensed UI without credentials
        if: (steps.scope.outputs.licensed == 'true' || github.ref_type == 'tag') && github.event_name == 'push'
        id: license_archive
        run: node scripts/ci-licensed.mjs prepare

      - name: Retain the lockfile-matched licensed package
        if: (steps.scope.outputs.licensed == 'true' || github.ref_type == 'tag') && github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.license_archive.outputs.name }}
          path: |
            ${{ runner.temp }}/rhodium-license/manifest.json
            ${{ runner.temp }}/rhodium-license/heroui-react.tgz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Mark the disposable test service
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const client = new PrismaClient();
          (async () => {
            const [identity] = await client.$queryRaw`SELECT current_database() AS database, current_user AS user`;
            if (identity.database !== 'rhodium_test' || identity.user !== 'rhodium') {
              throw new Error('Refusing to mark an unexpected CI database');
            }
            await client.$executeRawUnsafe(`COMMENT ON DATABASE "rhodium_test" IS 'rhodium:test-database'`);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; })
            .finally(() => client.$disconnect());
          NODE

      - name: Verify affected components
        if: github.ref_type != 'tag'
        env:
          CI_CONTAINER_BUILD: ${{ steps.scope.outputs.container == 'true' && github.event_name == 'push' }}
        run: node scripts/ci-checks.mjs run

      - name: Validate changed Compose definitions
        if: steps.scope.outputs.container == 'true'
        env:
          POSTGRES_PASSWORD: ci-configuration-check
        run: |
          docker compose --file docker-compose.yml config --quiet
          docker compose --file Docker/docker-compose.yml config --quiet

      - name: Build and smoke-test changed container
        if: steps.scope.outputs.container == 'true' && github.event_name == 'push'
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          docker build --secret id=heroui_key,env=HEROUI_KEY --tag rhodium-ci:check .
          docker run --detach --name rhodium-ci --network host \
            --env DATABASE_URL --env PORT=3033 --env HOSTNAME=127.0.0.1 rhodium-ci:check
          trap 'docker logs rhodium-ci; docker rm --force rhodium-ci >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3033/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3033/api/health
          docker exec rhodium-ci node -e 'if (process.getuid() === 0 || process.env.HEROUI_KEY || require("node:fs").existsSync("/run/secrets/heroui_key")) process.exit(1)'
          docker stop --time 15 rhodium-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' rhodium-ci)" = 0

      # Global suites only run for newly created version tags, never ordinary pushes.
      - name: Validate version globally
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created == true
        run: |
          npx prisma migrate deploy
          npm run typecheck
          npm run lint
          node --test scripts/*.test.mjs
          npm test
          npm run test:db
          npm run build
