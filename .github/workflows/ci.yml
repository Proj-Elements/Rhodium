name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    if: github.event.deleted != true && (github.ref_type != 'tag' || (github.event_name == 'push' && github.event.created == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: yueyu
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: yueyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yueyu -d yueyu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database: integration tests TRUNCATE every table.
      DATABASE_URL: postgresql://yueyu:testpw@127.0.0.1:5432/yueyu_test?schema=public
      TEST_DATABASE_URL: postgresql://yueyu:testpw@127.0.0.1:5432/yueyu_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
      # Audited local main before the empty GitHub repository's first publication.
      # Existing push/PR/queue bases always take precedence over this bootstrap.
      CI_BOOTSTRAP_BASE: 7552cd5d2ef8dcea6db139c518665dee692cbc05
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.4

      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Select affected checks
        if: github.ref_type != 'tag'
        id: scope
        run: node scripts/ci-checks.mjs plan

      - name: Validate new version tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
        run: node -e 'if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.VERSION)) process.exit(1)'

      # PR/queue code must never receive the license key. Without a trusted
      # artifact channel, UI verification fails explicitly rather than going green.
      - name: Require trusted licensed build
        if: (steps.scope.outputs.licensed == 'true' || github.ref_type == 'tag') && github.event_name != 'push'
        run: |
          echo '::error::Licensed type/build checks require a trusted repository push. PR/queue code receives no HEROUI_KEY; arrange a trusted artifact channel before requiring these events for UI changes.'
          exit 1

      - name: Initialize licensed UI
        if: (steps.scope.outputs.licensed == 'true' || github.ref_type == 'tag') && github.event_name == 'push'
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          test -n "$HEROUI_KEY" || { echo '::error::Missing repository HEROUI_KEY secret'; exit 1; }
          CI=1 npx -y hpsetup@4.7.4 react --auto --no-cache
          git diff --exit-code -- package.json package-lock.json
          node -e 'const fs=require("node:fs"),path=require("node:path"); const root=path.resolve("node_modules/@heroui-pro/react"); const p=JSON.parse(fs.readFileSync(path.join(root,"package.json"),"utf8")); if(!p.types||!fs.existsSync(path.join(root,p.types))) throw new Error("Licensed HeroUI types were not installed");'

      - name: Mark the disposable test service
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const client = new PrismaClient();
          (async () => {
            const [identity] = await client.$queryRaw`SELECT current_database() AS database, current_user AS user`;
            if (identity.database !== 'yueyu_test' || identity.user !== 'yueyu') {
              throw new Error('Refusing to mark an unexpected CI database');
            }
            await client.$executeRawUnsafe(`COMMENT ON DATABASE "yueyu_test" IS 'rhodium:test-database'`);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; })
            .finally(() => client.$disconnect());
          NODE

      - name: Verify affected components
        if: github.ref_type != 'tag'
        run: node scripts/ci-checks.mjs run

      # Global suites only run for newly created version tags, never ordinary pushes.
      - name: Validate version globally
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created == true
        run: |
          npx prisma migrate deploy
          npm run typecheck
          npm run lint
          node --test scripts/ci-checks.test.mjs
          npm test
          npm run test:db
          npm run build
