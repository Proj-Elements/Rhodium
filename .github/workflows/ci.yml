name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yueyu
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: yueyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yueyu -d yueyu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway database: the integration suite TRUNCATEs every table.
      DATABASE_URL: postgresql://yueyu:testpw@127.0.0.1:5432/yueyu_test?schema=public
      TEST_DATABASE_URL: postgresql://yueyu:testpw@127.0.0.1:5432/yueyu_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm run build
