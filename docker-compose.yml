services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yueyu
      # Set POSTGRES_PASSWORD in a local .env file (see .env.example); compose
      # refuses to start rather than fall back to a shared default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: yueyu
      TZ: Asia/Shanghai
    ports:
      # Loopback only: the ledger has no authentication layer.
      - "127.0.0.1:5432:5432"
    volumes:
      - yueyu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yueyu -d yueyu"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://yueyu:${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}@db:5432/yueyu?schema=public
      NEXT_PUBLIC_APP_NAME: 月余
      PORT: 3030
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
    ports:
      # Loopback only: never expose this app directly to a network.
      - "127.0.0.1:3030:3030"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/api/dashboard || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  yueyu-postgres:
