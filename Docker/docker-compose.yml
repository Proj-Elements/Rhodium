services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: yueyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yueyu_password}
      POSTGRES_DB: yueyu
      TZ: Asia/Shanghai
    # Bound to loopback by default: the app reaches Postgres over the compose
    # network, so this port only needs to be published for external tooling.
    # Override with DB_BIND=0.0.0.0 when you really want that.
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - yueyu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yueyu -d yueyu"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: rhodium:0.1.0
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: yueyu
      PGUSER: yueyu
      PGPASSWORD: ${POSTGRES_PASSWORD:-yueyu_password}
      RHODIUM_ALLOWED_HOSTS: ${RHODIUM_ALLOWED_HOSTS:-}
      RHODIUM_ALLOWED_ORIGINS: ${RHODIUM_ALLOWED_ORIGINS:-}
      RHODIUM_TRUST_PROXY: ${RHODIUM_TRUST_PROXY:-false}
      NEXT_PUBLIC_APP_NAME: Rhodium
      PORT: 3030
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
    # The app ships without any authentication, so it is bound to loopback by
    # default: whoever reaches this port can read and write the whole ledger.
    # Set APP_BIND=0.0.0.0 only on a network you trust.
    ports:
      - "${APP_BIND:-127.0.0.1}:3030:3030"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  yueyu-postgres:
